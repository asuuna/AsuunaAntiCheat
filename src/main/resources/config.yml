# AsuunaAntiCheat configuration
#
# Default policy: alert and mitigate, do not ban automatically.
# Keep thresholds conservative and test on a pre-production server before raising enforcement.

settings:
  debug: false
  alert-permission: asuunaac.alerts
  bypass-permission: asuunaac.bypass
  violation-decay-per-minute: 4.0
  alert-cooldown-millis: 1200
  log-alerts: true
  disabled-worlds: []

punishments:
  enabled: false
  max-violations: 25.0
  commands:
    - "kick %player% Unfair advantage detected (%check%)"

checks:
  movement-speed:
    enabled: true
    alert-vl: 4.0
    cancel-vl: 7.0
    max-horizontal-distance: 0.85
    speed-potion-bonus: 0.08

  flight:
    enabled: true
    alert-vl: 5.0
    cancel-vl: 8.0
    max-air-ticks: 24
    max-hover-delta: 0.03

  timer:
    enabled: true
    alert-vl: 5.0
    cancel-vl: 9.0
    max-moves: 28
    sample-millis: 1000
    min-horizontal-distance: 0.015

  step:
    enabled: true
    alert-vl: 4.0
    cancel-vl: 7.0
    max-y-gain: 0.95
    min-horizontal-distance: 0.08

  liquid-walk:
    enabled: true
    alert-vl: 4.0
    cancel-vl: 7.0
    max-surface-ticks: 8
    min-horizontal-distance: 0.08
    max-y-change: 0.04

  reach:
    enabled: true
    alert-vl: 3.0
    cancel-vl: 5.0
    max-distance: 3.35

  combat-angle:
    enabled: true
    alert-vl: 4.0
    cancel-vl: 7.0
    max-angle: 78.0
    min-distance: 1.25

  multi-aura:
    enabled: true
    alert-vl: 4.0
    cancel-vl: 7.0
    max-targets: 3
    sample-millis: 700

  autoclicker:
    enabled: true
    alert-vl: 4.0
    cancel-vl: 999.0
    max-cps: 18
    sample-millis: 1000
    min-consistent-samples: 12
    min-consistent-cps: 12
    min-interval-std-dev: 4.0

  fast-place:
    enabled: true
    alert-vl: 5.0
    cancel-vl: 8.0
    min-delay-millis: 45

  fast-break:
    enabled: true
    alert-vl: 5.0
    cancel-vl: 9.0
    min-delay-millis: 65

  block-reach:
    enabled: true
    alert-vl: 4.0
    cancel-vl: 7.0
    max-distance: 5.35

  nuker:
    enabled: true
    alert-vl: 5.0
    cancel-vl: 8.0
    max-breaks: 18
    sample-millis: 1000
    min-spread: 2.5

  fast-bow:
    enabled: true
    alert-vl: 4.0
    cancel-vl: 6.0
    min-force: 0.85
    min-draw-millis: 850

  fast-eat:
    enabled: true
    alert-vl: 4.0
    cancel-vl: 6.0
    min-consume-millis: 1200

  scaffold:
    enabled: true
    alert-vl: 5.0
    cancel-vl: 9.0
    min-down-pitch: 45.0
    min-vertical-gap: 0.45
    max-vertical-gap: 1.85
    max-horizontal-gap: 1.35

  inventory-move:
    enabled: true
    alert-vl: 4.0
    cancel-vl: 7.0
    min-horizontal-distance: 0.04
    open-grace-millis: 250

  inventory-click-speed:
    enabled: true
    alert-vl: 4.0
    cancel-vl: 7.0
    max-clicks: 18
    sample-millis: 1000

  nofall:
    enabled: true
    alert-vl: 6.0
    cancel-vl: 999.0
    min-fall-step: 0.08
    min-tracked-fall-distance: 4.2
    max-server-fall-distance: 0.75
